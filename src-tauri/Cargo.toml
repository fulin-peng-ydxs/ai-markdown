[package]
name = "plainroot"
version = "0.1.0"
description = "Plainroot local-first Markdown desktop editor"
authors = ["Plainroot contributors"]
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "plainroot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }

[package]
name = "plainroot"
version = "0.1.0"
description = "Plainroot local-first Markdown desktop editor"
authors = ["Plainroot contributors"]
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "plainroot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "plainroot"
path = "src/main.rs"
required-features = ["desktop-runtime"]

[features]
default = ["desktop-runtime"]
desktop-runtime = ["tauri/wry"]
e2e = [
    "desktop-runtime",
    "dep:tauri-plugin-wdio",
    "dep:tauri-plugin-wdio-webdriver",
]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "=0.3.4"
notify = "=8.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", default-features = false, features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-wdio = { version = "=1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.2.0", optional = true }
trash = "=5.2.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "=2.11.5", default-features = false, features = ["test"] }

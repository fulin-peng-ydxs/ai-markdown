name: Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@11.5.1 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt clippy
          rustup override set 1.97.1

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned tools
        run: |
          test "$(node --version)" = "v24.11.1"
          test "$(pnpm --version)" = "11.5.1"
          rustc --version | grep "rustc 1.97.1"

      - name: License gate
        run: pnpm test:licenses && pnpm licenses:check

      - name: Type and frontend gates
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Rust format and lint gates
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features

      - name: Desktop E2E
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm test:e2e 2>&1 | tee artifacts/e2e-${{ matrix.platform }}.log

      - name: Build unsigned production binary
        run: pnpm tauri build --no-bundle

      - name: Collect binary and checksum
        run: node scripts/collect-ci-artifact.mjs ${{ matrix.platform }}

      - name: Upload test binary and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plainroot-${{ matrix.platform }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
